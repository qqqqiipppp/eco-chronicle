<!doctype html><meta charset="utf-8"><title>Hero walk frame review</title>
<style>body{margin:12px;background:#d7ceb8;color:#222;font:14px sans-serif}.row{display:flex;gap:2px;margin-bottom:10px}.frame{width:132px;height:132px;background-size:900% 100%;image-rendering:pixelated;position:relative}.frame:after{content:attr(data-frame);position:absolute;bottom:0;left:0}h2{font-size:16px}</style>
<label>복장 <select id="outfit"><option>cloak</option><option>robe</option><option>overall</option><option>soccer</option><option>suit</option><option>dino</option></select></label>
<main id="review"></main>
<script>
function render(){const outfit=document.querySelector('#outfit').value;document.querySelector('#review').innerHTML=['west','south','north'].map(dir=>'<h2>'+dir+'</h2>'+['original','fixed'].map(version=>'<div>'+version+'</div><div class="row">'+Array.from({length:9},(_,i)=>'<div class="frame" data-frame="'+i+'" style="background-position:'+i*12.5+'% 0;background-image:url(\''+(version==='fixed'?'../assets/images/characters/hero-walk-'+outfit+'-'+dir+'.png':original[outfit][dir])+'\')"></div>').join('')+'</div>').join('')).join('')}
const original={cloak:{south:'../assets/images/characters/50825d38d1b6d721461cae88.png',north:'../assets/images/characters/686cccda4f7756b79dd5affb.png',west:'../assets/images/characters/da7c706aad5fa010d1cf9d28.png'},robe:{south:'../assets/images/characters/4cb0d6568158435e8402c1ea.png',north:'../assets/images/characters/8ffdc76add959ac9b6c26768.png',west:'../assets/images/characters/b338aea87a7f15bd60a2883e.png'},overall:{south:'../assets/images/characters/d8017b798546d1ce4db5c40d.png',north:'../assets/images/characters/10babc6c51493c20178e508f.png',west:'../assets/images/characters/0f60cf61711f6f77a8234674.png'},soccer:{south:'../assets/images/characters/6507ce293a232ea8e5ebb5f9.png',north:'../assets/images/characters/65b47c688a41597d43e154d6.png',west:'../assets/images/characters/553f6ac4257017972d8f608d.png'},suit:{south:'../assets/images/characters/5f04ac93257f9028d58824ea.png',north:'../assets/images/characters/b80ce0849548c71041d4dd4d.png',west:'../assets/images/characters/9f30f430d77a8b72d2f65460.png'},dino:{south:'../assets/images/characters/f2b39838f3726bb1fc409973.png',north:'../assets/images/characters/3f1d56842ade5fcb431d0f48.png',west:'../assets/images/characters/d2a4ba86d62df2f925bc0d8f.png'}};
document.querySelector('#outfit').onchange=render;render();
</script>
