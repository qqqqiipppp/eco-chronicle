<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 144" width="160" height="144">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2=".48" y2="1">
      <stop stop-color="#fffdf6"/>
      <stop offset=".58" stop-color="#f4eee7"/>
      <stop offset="1" stop-color="#ded4cc"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".35" y2="1">
      <stop stop-color="#fffdf5"/>
      <stop offset=".72" stop-color="#f3ece6"/>
      <stop offset="1" stop-color="#e4d8d0"/>
    </linearGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="79" cy="129" rx="61" ry="5" fill="#66574a" opacity=".16"/>

    <!-- A thin pink tail curls rightward across the ground. -->
    <path d="M122 93c15 5 30 17 30 27 0 9-10 14-21 9-7-3-14-6-21-4" fill="none" stroke="#806969" stroke-width="8"/>
    <path d="M122 93c15 5 30 17 30 27 0 9-10 14-21 9-7-3-14-6-21-4" fill="none" stroke="#e7a6a7" stroke-width="5"/>
    <path d="M113 125c8-2 14 3 20 5" fill="none" stroke="#f6cac2" stroke-width="1.7"/>

    <!-- Four small feet support the long arched body. -->
    <path d="M116 99c-2 8 0 14 5 18 3 3 8 3 11 5-3 4-10 5-15 2-8-4-11-11-10-21z" fill="#efbab2" stroke="#8d7770" stroke-width="2"/>
    <path d="M121 121l5 2m-1-5 5 3" fill="none" stroke="#b9827d" stroke-width="1.3"/>
    <path d="M94 101c-2 9-1 16 4 20 3 3 9 3 13 5-4 3-12 4-18 1-8-4-10-12-8-22z" fill="#f1bdb4" stroke="#8d7770" stroke-width="2"/>
    <path d="M99 124l4 2m0-5 5 3" fill="none" stroke="#b9827d" stroke-width="1.3"/>
    <path d="M47 98c-3 8-5 13-7 17-2 4 2 7 7 7 6 0 10-3 14-5-5-3-9-7-8-16z" fill="#edb6ae" stroke="#8d7770" stroke-width="2"/>
    <path d="M44 118l4 2m1-5 5 3" fill="none" stroke="#b9827d" stroke-width="1.3"/>

    <!-- A smooth white back rises in one arch from neck to rump. -->
    <path d="M45 69c11-15 29-25 50-27 19-2 35 8 42 27 7 18 3 34-9 42-14 9-43 6-62-2-17-7-30-23-21-40z" fill="url(#coat)" stroke="#746764" stroke-width="3"/>
    <path d="M60 67c10-12 25-20 41-20 16 0 27 8 32 21-12-12-24-14-39-11-13 3-23 10-29 18z" fill="#fffef8" opacity=".94"/>
    <path d="M91 108c16 8 29 6 39-3" fill="none" stroke="#c7b9b2" stroke-width="2"/>
    <path d="M73 96c6 8 12 12 21 15" fill="none" stroke="#ded1c8" stroke-width="2"/>

    <!-- Two upright, translucent ears frame the side-view face. -->
    <path d="M44 65c-5-8-5-18-1-23 5-6 13-4 17 3l3 17-10 11z" fill="#f6ede6" stroke="#806d69" stroke-width="2.8"/>
    <path d="M47 62c-3-7-3-14 0-17 3-3 8-1 10 4l2 13-7 6z" fill="#eab4b4"/>
    <path d="M53 48l3 5" fill="none" stroke="#ffe1d9" stroke-width="2"/>
    <path d="M60 66c-3-10 1-19 8-21 8-1 14 6 14 15l-9 13z" fill="#faf1e9" stroke="#806d69" stroke-width="2.8"/>
    <path d="M65 64c-2-7 1-13 5-14 5-1 8 4 8 10l-5 9z" fill="#ecb8b5"/>
    <path d="M69 52l4 3" fill="none" stroke="#ffe2db" stroke-width="2"/>

    <!-- The pointed nose leads the rounded left-facing muzzle. -->
    <path d="M52 60c-16 0-26 10-31 20-3 5-7 7-8 12-1 6 5 9 13 10l16 1c10 0 19-5 27-13 6-7 8-17 4-23-5-6-12-8-21-7z" fill="url(#face)" stroke="#746764" stroke-width="3"/>
    <path d="M24 81c8-13 18-19 30-18-11 6-18 13-20 23l-13 9-5-2z" fill="#fffdf7"/>
    <path d="M38 94c10 5 19 2 28-5" fill="none" stroke="#d7c7be" stroke-width="2"/>
    <path d="M13 87c4-3 9-1 10 3 1 3-2 6-6 6-3 0-6-3-6-5z" fill="#e99a9e"/>
    <path d="M15 89l3-1" fill="none" stroke="#ffe3db" stroke-width="1.7"/>

    <!-- A dark bead eye and fine whiskers keep the mouse expressive. -->
    <path d="M42 73c3-3 7-2 9 1 2 4 0 8-4 9-4 1-7-2-7-5 0-2 1-4 2-5z" fill="#463938"/>
    <path d="M44 73h3v3h-3z" fill="#fff9f1"/>
    <path d="M39 70c3-2 7-3 10-1" fill="none" stroke="#b7a29a" stroke-width="1.7"/>
    <path d="M27 91c3 4 7 4 10 2" fill="none" stroke="#b2928b" stroke-width="1.4"/>
    <path d="M25 90L8 82m20 11L7 91m22 2L9 103m21-8 11 13" fill="none" stroke="#99847d" stroke-width="1.2"/>
    <path d="M37 91l12-4m-10 7 14 1" fill="none" stroke="#b39b92" stroke-width="1.1"/>

    <!-- The nearest forefoot reaches the same floor as the hind feet. -->
    <path d="M65 96c-2 8-5 15-5 21-1 5 4 8 10 8 7 0 12-3 16-6-6-3-11-8-12-18z" fill="#f2bdb3" stroke="#8d7770" stroke-width="2.2"/>
    <path d="M65 120l4 3m2-6 4 4m2-6 4 3" fill="none" stroke="#bb8580" stroke-width="1.3"/>
    <path d="M73 70c3 4 4 10 2 15" fill="none" stroke="#d5c7c0" stroke-width="1.5"/>
  </g>
</svg>
